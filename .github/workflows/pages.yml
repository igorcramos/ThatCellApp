name: Deploy ThatCellApp to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html styles.css reagent-operations.css culture-media.css _site/
          cp app.js schedule-calendar.js supabase-js.min.js supabase-local.js i18n.js _site/
          cp reagent-inventory.js reagent-operations.js reagent-checklists.js culture-media.js _site/
          cp barcode-scanner.js zxing-browser.min.js _site/
          cp -R assets _site/assets
          cp -R docs _site/docs
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
